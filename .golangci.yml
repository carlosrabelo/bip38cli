version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - dogsled
    - dupl
    - errcheck
    - gocyclo
    - revive
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
    depguard:
      rules:
        MyAllowed:
          files:
            - $all
          allow:
            - $gostd
            - github.com/carlosrabelo/bip38cli/**
            - github.com/btcsuite/btcd/**
            - github.com/spf13/cobra
            - golang.org/x/crypto/**
            - golang.org/x/text/**
            - github.com/sirupsen/logrus
            - github.com/stretchr/testify/**
            - golang.org/x/term
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
    misspell:
      locale: US
    lll:
      line-length: 160
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gomnd
          - funlen
          - goconst
          - gocyclo
      - path: internal/cli/
        linters:
          - gochecknoinits

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  settings:
    goimports:
      local-prefixes:
        - github.com/carlosrabelo/bip38cli
